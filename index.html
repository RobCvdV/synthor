<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#0e1014" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Synthor" />
    <title>synthor</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="sw-update" style="display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#20242a;color:#e0e0e0;border:1px solid #3a3f47;border-radius:8px;padding:10px 18px;font:13px system-ui;z-index:9999;cursor:pointer;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.4);user-select:none;" title="Click to reload with the latest version">🔄 Update available — click to reload</div>
    <script>
      // Only register the service worker when Vite's dev client is absent
      // (i.e. in production builds where PWA generates /sw.js correctly).
      if ('serviceWorker' in navigator && !document.querySelector('script[src*="@vite/client"]')) {
        navigator.serviceWorker.register('/sw.js', { scope: '/', type: 'classic' }).then(reg => {
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                const el = document.getElementById('sw-update');
                if (el) {
                  el.style.display = 'block';
                  el.addEventListener('click', () => {
                    // Tell the waiting worker to activate, then reload.
                    // If it already activated (skipWaiting fired first), reload anyway.
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                    setTimeout(() => window.location.reload(), 300);
                  }, { once: true });
                }
              }
            });
          });
        });
        // Poll for updates periodically (every ~10 minutes)
        let lastCheck = 0;
        setInterval(() => {
          if (Date.now() - lastCheck < 600_000) return;
          lastCheck = Date.now();
          if (document.visibilityState !== 'visible') return;
          navigator.serviceWorker.getRegistration().then(r => { if (r) r.update(); });
        }, 600_000 + Math.random() * 120_000);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
