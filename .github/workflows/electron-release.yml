name: Build Electron release

on:
  push:
    tags:
      - 'deploy-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      HAS_DEVELOPER_ID: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: AppImage
          - os: macos-latest
            platform: mac
            artifact: dmg
          - os: windows-latest
            platform: windows
            artifact: nsis

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#deploy-v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      # Notarization reads the App Store Connect API key from a file.
      - name: Write App Store Connect API key
        if: matrix.platform == 'mac' && env.HAS_NOTARY_KEY == 'true'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build Electron app (${{ matrix.platform }})
        env:
          # Developer ID signing + notarization on mac when the secrets exist;
          # otherwise the afterPack hook ad-hoc signs.
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CERT_PASSWORD || '' }}
          # Off, findIdentity ignores the CSC_LINK keychain and signing is skipped.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' && env.HAS_DEVELOPER_ID == 'true' && 'true' || 'false' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
        run: npm run electron:build -- --publish never --config.extraMetadata.version=${{ steps.version.outputs.version }}

      - name: Verify macOS signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          app="$(ls -d release/mac*/Synthor.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|Signature' || true
          if [ "$HAS_DEVELOPER_ID" = true ] && [ "$HAS_NOTARY_KEY" = true ]; then
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.platform }}
          path: |
            release/*.AppImage
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: electron-*
          merge-multiple: true
          path: release-artifacts

      - name: List release files
        run: ls -la release-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
