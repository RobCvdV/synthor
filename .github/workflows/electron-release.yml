name: Build Electron release

on:
  push:
    tags:
      - 'deploy-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      HAS_DEVELOPER_ID: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: AppImage
          - os: macos-latest
            platform: mac
            artifact: dmg
          - os: windows-latest
            platform: windows
            artifact: nsis

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#deploy-v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      # The logo's tracker row shows the version (0.1.5 → C-0 01 05); re-renders every icon.
      - name: Stamp the version into the logo
        shell: bash
        run: node scripts/stamp-version.mjs "$GITHUB_REF_NAME"

      # Our own keychain instead of CSC_LINK: electron-builder passes the .p12
      # password to set-key-partition-list, which needs the keychain password.
      - name: Import Developer ID certificate
        if: matrix.platform == 'mac' && env.HAS_DEVELOPER_ID == 'true'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 32)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "::error::No valid Developer ID Application identity in the imported certificate"; exit 1; }

      # Notarization reads the App Store Connect API key from a file.
      - name: Write App Store Connect API key
        if: matrix.platform == 'mac' && env.HAS_NOTARY_KEY == 'true'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build Electron app (${{ matrix.platform }})
        env:
          # Developer ID signing + notarization on mac when the secrets exist
          # (identity found in the imported keychain); otherwise the afterPack
          # hook ad-hoc signs.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' && env.HAS_DEVELOPER_ID == 'true' && 'true' || 'false' }}
          SYNTHOR_DEVELOPER_ID: ${{ matrix.platform == 'mac' && env.HAS_DEVELOPER_ID == 'true' && '1' || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.APPLE_API_ISSUER || '' }}
        run: npm run electron:build -- --publish never --config.extraMetadata.version=${{ steps.version.outputs.version }}

      - name: Verify macOS signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          app="$(ls -d release/mac*/Synthor.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|Signature' || true
          if [ "$HAS_DEVELOPER_ID" = true ] && [ "$HAS_NOTARY_KEY" = true ]; then
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: electron-${{ matrix.platform }}
          # The latest*.yml feeds, blockmaps and the mac zip are what the app's auto-updater reads.
          path: |
            release/*.AppImage
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: electron-*
          merge-multiple: true
          path: release-artifacts

      - name: List release files
        run: ls -la release-artifacts

      # Every platform's update feed must ship, or that platform's installs stop updating.
      - name: Check update feeds
        run: |
          for f in latest.yml latest-mac.yml latest-linux.yml; do
            test -f "release-artifacts/$f" || { echo "::error::missing $f"; exit 1; }
          done

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
